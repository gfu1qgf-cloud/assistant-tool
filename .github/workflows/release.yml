name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Require version-specific release notes
        run: python packaging/release_notes.py --version "$env:GITHUB_REF_NAME" --output dist_final/RELEASE_NOTES.md

      - name: Install dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -r requirements.txt
          python -m pip install -r packaging/requirements-build.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python packaging/run_tests_isolated.py

      - name: Fetch pinned mpv runtime
        run: python packaging/fetch_mpv.py

      - name: Fetch pinned standard FFmpeg runtime
        run: python packaging/fetch_ffmpeg.py

      - name: Build Windows application
        run: pyinstaller --noconfirm --clean packaging/AssistantTool.spec

      - name: Record source and actual dependency versions
        run: python packaging/build_manifest.py --version "$env:GITHUB_REF_NAME" --commit "$env:GITHUB_SHA" --output dist/AssistantTool/BUILD_INFO.json

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item README.md dist\AssistantTool\README.md
          Copy-Item CHANGELOG.md dist\AssistantTool\CHANGELOG.md
          Copy-Item config.example.json dist\AssistantTool\config.example.json
          Copy-Item app_icon.png dist\AssistantTool\app_icon.png
          Copy-Item app_icon.ico dist\AssistantTool\app_icon.ico
          New-Item -ItemType Directory -Force dist_final | Out-Null
          Compress-Archive -Path dist\AssistantTool\* -DestinationPath dist_final\AssistantTool-Windows.zip

      - name: Check release privacy and completeness
        run: python packaging/check_release_artifact.py dist_final/AssistantTool-Windows.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist_final/AssistantTool-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist_final/AssistantTool-Windows.zip
          body_path: dist_final/RELEASE_NOTES.md
          generate_release_notes: false

  # Run only after the Release exists: the review platform requires a fresh
  # SARIF upload newer than Release.published_at, not just a pre-release scan.
  post-release-codeql:
    needs: build-and-release
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
